# nixpacks.toml (Repo-Root)
[phases.setup]
# Über python312/nodejs_20 hinaus: pillow-heif (HEIC-Unterstützung) und
# mediapipe/opencv (Posen-Normalisierung) brauchen zur Laufzeit native
# Shared Libraries, die im schlanken Nixpacks-Basisimage standardmäßig
# fehlen (gefunden beim ersten echten Railway-Deploy: "ImportError:
# libstdc++.so.6: cannot open shared object file"). gcc-unwrapped liefert
# libstdc++, der Rest sind die üblichen X11/OpenGL-Laufzeitbibliotheken,
# die opencv-python beim Import braucht.
nixPkgs = ["python312", "nodejs_20", "gcc-unwrapped", "glib", "libGL", "libGLU", "xorg.libSM", "xorg.libXext", "xorg.libXrender"]

[phases.install]
cmds = [
  "cd backend && python -m venv .venv && .venv/bin/pip install -r requirements.txt",
  "cd frontend && npm ci",
]

[phases.build]
cmds = [
  "cd frontend && npm run build",
  # Tests als Deploy-Gate: schlägt einer der beiden Befehle fehl, bricht
  # der Build ab und es wird nichts Kaputtes deployed (siehe Design-Spec
  # Abschnitt "Testing als Deploy-Gate").
  "cd frontend && npx tsc --noEmit",
  "cd backend && .venv/bin/python -m pytest -q",
]

[start]
cmd = "cd backend && .venv/bin/alembic upgrade head && .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT"
