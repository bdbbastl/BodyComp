# nixpacks.toml (Repo-Root)
[phases.setup]
# pillow-heif (HEIC-Unterstützung) und mediapipe/opencv (Posen-
# Normalisierung) brauchen zur Laufzeit native Shared Libraries, die im
# schlanken Nixpacks-Basisimage fehlen (gefunden beim ersten echten
# Railway-Deploy: "ImportError: libstdc++.so.6: cannot open shared
# object file").
#
# Zwei vorherige Versuche sind gescheitert und dokumentiert als Warnung
# für künftige Änderungen an dieser Datei:
# 1. nixPkgs=["gcc-unwrapped", ...] - hat nichts geändert, weil
#    gcc-unwrappeds Haupt-Output (wo der Compiler-Binary liegt) nicht
#    denselben "lib"-Output wie die Laufzeitbibliothek selbst ist -
#    Nixpacks bindet nur die "lib"-Outputs von nixPkgs-Einträgen
#    automatisch in LD_LIBRARY_PATH ein.
# 2. aptPkgs=["libstdc++6", ...] + manuelles LD_LIBRARY_PATH auf
#    /usr/lib/x86_64-linux-gnu - apt installierte zwar erfolgreich,
#    aber das manuelle LD_LIBRARY_PATH hat das System-libc VOR das
#    Nix-eigene libc geschoben (inkompatible glibc-Version), wodurch
#    python selbst beim Start crashte ("symbol lookup error ...
#    GLIBC_PRIVATE").
#
# Der korrekte, gezielte nixpkgs-Attributpfad für NUR die Laufzeit-
# Bibliothek (nicht den ganzen Compiler) ist `stdenv.cc.cc.lib` - dessen
# "lib"-Output bindet Nixpacks automatisch und korrekt in
# LD_LIBRARY_PATH ein, ohne mit dem System-libc zu kollidieren.
nixPkgs = ["python312", "nodejs_20", "stdenv.cc.cc.lib", "libGL", "libGLU", "glib", "xorg.libSM", "xorg.libXext", "xorg.libXrender"]

[phases.install]
cmds = [
  "cd backend && python -m venv .venv && .venv/bin/pip install -r requirements.txt",
  "cd frontend && npm ci",
]

[phases.build]
cmds = [
  "cd frontend && npm run build",
  # Tests als Deploy-Gate: schlägt einer der beiden Befehle fehl, bricht
  # der Build ab und es wird nichts Kaputtes deployed (siehe Design-Spec
  # Abschnitt "Testing als Deploy-Gate").
  "cd frontend && npx tsc --noEmit",
  "cd backend && .venv/bin/python -m pytest -q",
]

[start]
cmd = "cd backend && .venv/bin/alembic upgrade head && .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT"
