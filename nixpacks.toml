# nixpacks.toml (Repo-Root)
[phases.setup]
nixPkgs = ["python312", "nodejs_20"]
# pillow-heif (HEIC-Unterstützung) und mediapipe/opencv (Posen-
# Normalisierung) brauchen zur Laufzeit native Shared Libraries, die im
# schlanken Nixpacks-Basisimage fehlen (gefunden beim ersten echten
# Railway-Deploy: "ImportError: libstdc++.so.6: cannot open shared
# object file"). Bewusst über aptPkgs statt nixPkgs gelöst: Nix-Pakete
# landen in einem isolierten Store-Pfad, der nicht automatisch im
# Laufzeit-Bibliothekspfad (LD_LIBRARY_PATH) auftaucht - ein erster
# Versuch mit nixPkgs=["gcc-unwrapped", ...] hat GENAU DESHALB nichts
# geändert. Debian-Pakete via aptPkgs klinken sich dagegen normal über
# ldconfig ins System ein und funktionieren zuverlässig für genau diese
# Klasse von Problem.
aptPkgs = ["libstdc++6", "libgl1", "libglib2.0-0", "libsm6", "libxext6", "libxrender1", "libgomp1"]

# apt installiert diese Bibliotheken zwar erfolgreich (siehe Build-Log),
# aber python312 kommt aus nixPkgs - ein Nix-gebautes Python sucht
# standardmäßig NICHT in normalen System-Pfaden wie /usr/lib/... nach
# Shared Libraries, selbst wenn apt sie genau dorthin installiert hat.
# LD_LIBRARY_PATH zwingt den dynamischen Linker, dort trotzdem
# nachzuschauen - /usr/lib/x86_64-linux-gnu ist der standardmäßige
# Debian-Multiarch-Pfad, in den aptPkgs auf Nixpacks-Images installiert.
[variables]
LD_LIBRARY_PATH = "/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH"

[phases.install]
cmds = [
  "cd backend && python -m venv .venv && .venv/bin/pip install -r requirements.txt",
  "cd frontend && npm ci",
]

[phases.build]
cmds = [
  "cd frontend && npm run build",
  # Tests als Deploy-Gate: schlägt einer der beiden Befehle fehl, bricht
  # der Build ab und es wird nichts Kaputtes deployed (siehe Design-Spec
  # Abschnitt "Testing als Deploy-Gate").
  "cd frontend && npx tsc --noEmit",
  "cd backend && .venv/bin/python -m pytest -q",
]

[start]
cmd = "cd backend && .venv/bin/alembic upgrade head && .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT"
